<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Class 1</title>
</head>

<body align="center">

    <h1>Class 1</h1>
    <h2>Personal Information</h2>

    <form action="">
        <label for="name">Full Name:</label><br>
        <input type="text" id="name" name="name"><br><br>

        <label for="email">Email:</label><br>
        <input type="email" id="email" name="email"><br><br>

        <label for="phone">Phone:</label><br>
        <input type="tel" id="phone" name="phone"><br><br>

        <label for="dob">Date of Birth:</label><br>
        <input type="date" id="dob" name="dob"><br><br>

        <label>Gender:</label><br>
        <input type="radio" name="gender" value="male">
        Male
        <input type="radio" name="gender" value="female">
        Female
        <input type="radio" name="gender" value="other">
        Other<br><br>

        <label for="address">Address:</label><br>
        <textarea id="address" name="address" rows="3"></textarea><br><br>

        <input type="submit" value="Submit">
    </form>

    <h2>Work Schedule</h2>

    <table border="1" cellspacing="0" cellpadding="8" style="margin-left: 40%;">
        <caption>Working Hours</caption>
        <tr>
            <th>Working Days</th>
            <th>Working Hours</th>
        </tr>
        <tr>
            <td>Sunday</td>
            <td>11 AM - 7 PM</td>
        </tr>
        <tr>
            <td>Monday</td>
            <td>11 AM - 7 PM</td>
        </tr>
    </table>


    <h2>List</h2>
    <ol>
        <li>
            Coffee
            <ul>
                <li>Black</li>
                <li>Latte</li>
            </ul>
        </li>
        <li>Tea</li>
        <li>Milk</li>
    </ol>

    <h2>Button</h2>
    <button onclick="alert('Hello ICSL!')">Alert</button>

    <h2>Image</h2>
      <img src="img/images.jpeg" alt="Image" width="460">
</body>

</html>
