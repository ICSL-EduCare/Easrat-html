<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Hands on Test on HTML">
    <title>HTML</title>
</head>

<body>

    <header>
        <h1>HTML HOMEWORK</h1>
    </header>

    <nav>
        <a href="#image-link">Image</a> /
        <a href="#video-section">Video</a> / 
        <a href="#contact-form">Contact</a>
    </nav>

    <main>

        <section id="image-link">
            <h2>Image Link</h2>
            <a href="mailto:?subject=Image Link">
                <img
                    src="https://images.unsplash.com/photo-1593108408993-58ee9c7825c2?ixid=MnxwMjA3DB8MHxwaG90by1wYWdlfHx8GFVuFDB8fHx8&ixlib=rb-1.2.1&auto=format&fit=crop&w=1470&q=80"
                    width="900" height="600" alt="Unsplash Image">
            </a>
        </section>

        <section id="video-section">
            <h2>Video Section</h2>
            <video width="800" controls poster="https://assets.codepen.io/32795/poster.png">
                <source src="https://media.w3.org/2010/05/sintel/trailer.mp4" type="video/mp4">
                <source src="https://media.w3.org/2010/05/sintel/trailer.webm" type="video/webm">
                <source src="https://media.w3.org/2010/05/sintel/trailer.ogv" type="video/ogg">
                <track
                    src="subtitles_en.vtt" kind="subtitles" srclang="en" label="English">
                <track
                    src="subtitles_de.vtt" kind="subtitles" srclang="de" label="German Deutsch">
                Your browser does not support the video tag.
            </video>
        </section>

        <section id="contact-form">
            <h2>Contact Form</h2>
            <form>
                <fieldset>
                    <legend>Contact Form</legend>
                    <p>
                        <label for="name">Your Name:</label><br>
                        <input type="text" id="name" name="name" required>
                    </p>
                    <p>
                        <label for="phone">Your Phone:</label><br>
                        <input
                            type="tel"
                            id="phone"
                            name="phone"
                            pattern="[+]?880[ ]?1[3-9][0-9]{2}[- ]?[0-9]{6}" required>
                    </p>
                    <p>
                        <label for="email">Your Email:</label><br>
                        <input type="email" id="email" name="email" required>
                    </p>
                    <p>
                        <label for="country">Your Country:</label><br>
                        <select id="country" name="country" required>
                            <option value="">Select Country</option>
                            <option>Bangladesh</option>
                            <option>India</option>
                            <option>Pakistan</option>
                            <option>UAE</option>
                            <option>Brazil</option>
                            <option>Japan</option>
                            <option>Malaysia</option>
                            <option>Singapore</option>
                            <option>UK</option>
                            <option>USA</option>
                        </select>
                    </p>
                    <p>
                        <label for="state">Your State:</label><br>
                        <select id="state" name="state" required>
                            <option value="">Select State/Division</option>
                            <option>Dhaka</option>
                            <option>Chattogram</option>
                            <option>Rajshahi</option>
                            <option>Khulna</option>
                            <option>Barishal</option>
                            <option>Sylhet</option>
                            <option>Rangpur</option>
                            <option>Mymensingh</option>
                            <option>Bagerhat</option>
                            <option>Shewrapara</option>
                        </select>
                    </p>
                    <p>
                        <label for="message">Your Message:</label><br>
                        <textarea
                            id="message"
                            name="message"
                            rows="6"
                            cols="50"
                            required></textarea>
                    </p>
                    <p>
                        <input type="submit" value="Submit">
                        <input type="reset" value="Reset">
                    </p>

                </fieldset>
            </form>
        </section>
    </main>

    <footer>
        <p>&copy; Easrat Jahan Afrina 2026</p>
    </footer>

</body>
</html>
